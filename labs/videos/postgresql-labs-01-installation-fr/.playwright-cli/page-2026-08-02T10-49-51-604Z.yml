      - heading "Interactive installer by EDB" [level=2] [ref=e61]
      - paragraph [ref=e62]:
        - link "Download the installer" [ref=e63] [cursor=pointer]:
          - /url: https://www.enterprisedb.com/downloads/postgres-postgresql-downloads
        - text: certified by EDB for all supported Postgres versions.
      - paragraph [ref=e64]:
        - strong [ref=e65]: Note!
        - text: This installer is hosted by EDB and not on the PostgreSQL community servers. If you have issues with the website it's hosted on, please contact
        - link "webmaster@enterprisedb.com" [ref=e66] [cursor=pointer]:
          - /url: mailto:webmaster@enterprisedb.com
        - text: .
      - paragraph [ref=e67]: "This installer includes:"
      - list [ref=e68]:
        - listitem [ref=e69]: The PostgreSQL server
        - listitem [ref=e70]: pgAdmin, a graphical tool for managing and developing your databases
        - listitem [ref=e71]: StackBuilder, a package manager for downloading and installing additional PostgreSQL tools and drivers. Stackbuilder includes management, integration, migration, replication, geospatial, connectors and other tools.
      - paragraph [ref=e72]: This installer can run in graphical or silent install modes.
      - paragraph [ref=e73]:
        - text: The Windows installer is designed to be a straightforward, fast way to get up and running with Postgres. In the unlikely event that you have issues with the installer, please report them on the
        - link "installer Github page" [ref=e74] [cursor=pointer]:
          - /url: https://github.com/EnterpriseDB/edb-installers/issues
        - text: . Issues with the installed packages should be reported to the appropriate project directly.
      - paragraph [ref=e75]:
        - text: Advanced users can also download a
        - link "zip archive" [ref=e76] [cursor=pointer]:
          - /url: https://www.enterprisedb.com/download-postgresql-binaries
        - text: of the binaries, without the installer. This download is intended for users who wish to include Postgres as part of another application installer.
