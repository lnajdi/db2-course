<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PostgreSQL Indexes and Performance Optimization Quiz</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: linear-gradient(135deg, #4facfe 0%, #00f2fe 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .quiz-container {
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.1);
            width: 100%;
            max-width: 800px;
            padding: 40px;
            animation: fadeIn 0.8s ease-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .quiz-header {
            text-align: center;
            margin-bottom: 40px;
            border-bottom: 3px solid #4facfe;
            padding-bottom: 20px;
        }

        .quiz-title {
            color: #2d3748;
            font-size: 2.2em;
            font-weight: 700;
            margin-bottom: 10px;
        }

        .quiz-subtitle {
            color: #718096;
            font-size: 1.1em;
        }

        .progress-container {
            margin-bottom: 30px;
        }

        .progress-info {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
        }

        .question-counter {
            font-weight: 600;
            color: #4a5568;
            font-size: 1.1em;
        }

        .score-display {
            font-weight: 600;
            color: #4facfe;
            font-size: 1.1em;
        }

        .progress-bar {
            height: 8px;
            background-color: #e2e8f0;
            border-radius: 4px;
            overflow: hidden;
        }

        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, #4facfe, #00f2fe);
            transition: width 0.3s ease;
        }

        .question-container {
            margin-bottom: 30px;
        }

        .question-text {
            font-size: 1.3em;
            color: #2d3748;
            line-height: 1.6;
            margin-bottom: 25px;
            padding: 20px;
            background: #f7fafc;
            border-radius: 12px;
            border-left: 5px solid #4facfe;
        }

        .code-block {
            background: #1a202c;
            color: #e2e8f0;
            padding: 15px;
            border-radius: 8px;
            font-family: 'Courier New', monospace;
            margin: 15px 0;
            overflow-x: auto;
            font-size: 0.9em;
            line-height: 1.4;
        }

        .options-container {
            display: grid;
            gap: 15px;
            margin-bottom: 30px;
        }

        .option-button {
            background: white;
            border: 2px solid #e2e8f0;
            border-radius: 12px;
            padding: 18px 20px;
            text-align: left;
            cursor: pointer;
            transition: all 0.3s ease;
            font-size: 1.1em;
            color: #4a5568;
            position: relative;
            overflow: hidden;
        }

        .option-button:hover {
            border-color: #4facfe;
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(79, 172, 254, 0.15);
        }

        .option-button.selected {
            border-color: #4facfe;
            background: #ebf8ff;
        }

        .option-button.correct {
            border-color: #38a169;
            background: #f0fff4;
            color: #22543d;
        }

        .option-button.incorrect {
            border-color: #e53e3e;
            background: #fff5f5;
            color: #742a2a;
        }

        .option-button.disabled {
            cursor: not-allowed;
            opacity: 0.7;
        }

        .option-letter {
            font-weight: 700;
            color: #4facfe;
            margin-right: 12px;
        }

        .controls-container {
            display: flex;
            gap: 15px;
            align-items: center;
            flex-wrap: wrap;
        }

        .btn {
            padding: 12px 24px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 1em;
            font-weight: 600;
            transition: all 0.3s ease;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }

        .btn-primary {
            background: linear-gradient(135deg, #4facfe, #00f2fe);
            color: white;
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(79, 172, 254, 0.3);
        }

        .btn-secondary {
            background: #f7fafc;
            color: #4a5568;
            border: 2px solid #e2e8f0;
        }

        .btn-secondary:hover {
            background: #edf2f7;
            border-color: #cbd5e0;
        }

        .btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none !important;
            box-shadow: none !important;
        }

        .hint-container {
            background: #fffbeb;
            border: 1px solid #f6cc3e;
            border-radius: 8px;
            padding: 15px;
            margin: 20px 0;
            color: #744210;
            display: none;
        }

        .hint-container.show {
            display: block;
            animation: slideDown 0.3s ease-out;
        }

        @keyframes slideDown {
            from { opacity: 0; transform: translateY(-10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .explanation {
            background: #f0fff4;
            border: 1px solid #9ae6b4;
            border-radius: 12px;
            padding: 20px;
            margin: 20px 0;
            color: #22543d;
            display: none;
        }

        .explanation.show {
            display: block;
            animation: slideDown 0.3s ease-out;
        }

        .explanation h4 {
            color: #22543d;
            margin-bottom: 10px;
            font-size: 1.1em;
        }

        .explanation p {
            line-height: 1.6;
        }

        .results-container {
            text-align: center;
            padding: 40px 20px;
            display: none;
        }

        .results-container.show {
            display: block;
        }

        .final-score {
            font-size: 3em;
            font-weight: 700;
            color: #4facfe;
            margin-bottom: 20px;
        }

        .results-message {
            font-size: 1.3em;
            color: #4a5568;
            margin-bottom: 30px;
            line-height: 1.6;
        }

        .performance-breakdown {
            background: #f7fafc;
            border-radius: 12px;
            padding: 25px;
            margin: 30px 0;
        }

        .performance-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 0;
            border-bottom: 1px solid #e2e8f0;
        }

        .performance-item:last-child {
            border-bottom: none;
        }

        .restart-btn {
            margin-top: 20px;
        }

        @media (max-width: 640px) {
            .quiz-container {
                margin: 10px;
                padding: 20px;
            }

            .quiz-title {
                font-size: 1.8em;
            }

            .question-text {
                font-size: 1.2em;
                padding: 15px;
            }

            .option-button {
                padding: 15px;
                font-size: 1em;
            }

            .controls-container {
                flex-direction: column;
                align-items: stretch;
            }

            .btn {
                width: 100%;
                justify-content: center;
            }
        }

        .difficulty-badge {
            display: inline-block;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 0.8em;
            font-weight: 600;
            margin-left: 10px;
        }

        .difficulty-easy {
            background: #c6f6d5;
            color: #22543d;
        }

        .difficulty-medium {
            background: #fef5e7;
            color: #744210;
        }

        .difficulty-hard {
            background: #fed7d7;
            color: #742a2a;
        }
    </style>
</head>
<body>
    <div class="quiz-container">
        <div class="quiz-header">
            <h1 class="quiz-title">PostgreSQL Indexes & Performance</h1>
            <p class="quiz-subtitle">Test your knowledge of database indexing strategies</p>
        </div>

        <div id="quiz-content">
            <div class="progress-container">
                <div class="progress-info">
                    <span class="question-counter" id="question-counter">Question 1 of 20</span>
                    <span class="score-display" id="score-display">Score: 0/20</span>
                </div>
                <div class="progress-bar">
                    <div class="progress-fill" id="progress-fill" style="width: 5%"></div>
                </div>
            </div>

            <div class="question-container">
                <div class="question-text" id="question-text">Loading question...</div>
                <div class="options-container" id="options-container"></div>
                <div class="hint-container" id="hint-container"></div>
                <div class="explanation" id="explanation"></div>
            </div>

            <div class="controls-container">
                <button class="btn btn-secondary" id="hint-btn" onclick="showHint()">
                    💡 Show Hint
                </button>
                <button class="btn btn-primary" id="next-btn" onclick="nextQuestion()" disabled>
                    Next Question →
                </button>
            </div>
        </div>

        <div class="results-container" id="results-container">
            <div class="final-score" id="final-score">0/20</div>
            <div class="results-message" id="results-message"></div>
            <div class="performance-breakdown">
                <div class="performance-item">
                    <span>Correct Answers:</span>
                    <span id="correct-count">0</span>
                </div>
                <div class="performance-item">
                    <span>Incorrect Answers:</span>
                    <span id="incorrect-count">0</span>
                </div>
                <div class="performance-item">
                    <span>Accuracy:</span>
                    <span id="accuracy-percent">0%</span>
                </div>
            </div>
            <button class="btn btn-primary restart-btn" onclick="restartQuiz()">
                🔄 Restart Quiz
            </button>
        </div>
    </div>

    <script>
        const quizData = [
            {
                question: "What is a database index in PostgreSQL?",
                options: [
                    "A copy of the entire table stored separately for backup purposes",
                    "A data structure that improves the speed of data retrieval operations",
                    "A constraint that prevents duplicate values in a column",
                    "A view that shows only the most frequently accessed rows"
                ],
                correctAnswer: 1,
                hint: "Think about the primary purpose of indexes in database performance.",
                explanation: "A database index is a data structure that improves the speed of data retrieval operations on a database table, at the cost of additional writes and storage space to maintain the index.",
                difficulty: "easy"
            },
            {
                question: "What is the main trade-off when using indexes?",
                options: [
                    "They improve read performance but slow down write operations",
                    "They reduce storage space but increase query time",
                    "They improve security but reduce data integrity",
                    "They speed up all operations with no downsides"
                ],
                correctAnswer: 0,
                hint: "Consider what happens when the database needs to maintain the index during data modifications.",
                explanation: "Indexes improve SELECT query performance but slow down INSERT, UPDATE, and DELETE operations because the index must be maintained when data changes.",
                difficulty: "easy"
            },
            {
                question: "What is the default index type in PostgreSQL?",
                options: [
                    "Hash",
                    "B-Tree",
                    "GIN",
                    "GiST"
                ],
                correctAnswer: 1,
                hint: "Think about which index type is most versatile and commonly used.",
                explanation: "B-Tree is the default index type in PostgreSQL. It's the most versatile, supporting equality and range queries efficiently.",
                difficulty: "easy"
            },
            {
                question: "What happens when a query runs on a table without an appropriate index?",
                options: [
                    "The query will fail with an error",
                    "PostgreSQL automatically creates a temporary index",
                    "The database performs a full table scan",
                    "Only the first 1000 rows are examined"
                ],
                correctAnswer: 2,
                hint: "Consider how the database would find data if it can't use an index to jump directly to relevant rows.",
                explanation: "Without an appropriate index, PostgreSQL must perform a full table scan, examining every row in the table to find matches.",
                difficulty: "medium"
            },
            {
                question: "What is the correct syntax to create a basic index on a column in PostgreSQL?",
                options: [
                    "ADD INDEX idx_name ON table_name (column_name)",
                    "CREATE INDEX idx_name ON table_name (column_name)",
                    "INSERT INDEX idx_name INTO table_name (column_name)",
                    "MAKE INDEX idx_name FOR table_name (column_name)"
                ],
                correctAnswer: 1,
                hint: "The command should clearly indicate you're creating an index structure.",
                explanation: "The correct syntax is CREATE INDEX idx_name ON table_name (column_name) to create an index on a specific column.",
                difficulty: "easy"
            },
            {
                question: "For a composite index on (customer_id, rental_date), which query would benefit MOST from this index?",
                options: [
                    "WHERE rental_date = '2005-07-01'",
                    "WHERE customer_id = 123 AND rental_date > '2005-07-01'",
                    "WHERE rental_date > '2005-07-01' AND customer_id = 123",
                    "WHERE customer_id IN (1,2,3) OR rental_date = '2005-07-01'"
                ],
                correctAnswer: 1,
                hint: "In composite indexes, the order of columns matters - the leftmost column should be used first.",
                explanation: "Option 1 benefits most because it uses the leftmost column (customer_id) first, then the second column, matching the index structure perfectly.",
                difficulty: "hard"
            },
            {
                question: "Hash indexes in PostgreSQL can be used for range queries (e.g., WHERE column > 100).",
                options: ["True", "False"],
                correctAnswer: 1,
                hint: "Consider what type of operations hash functions are designed for.",
                explanation: "False. Hash indexes are optimized only for equality comparisons (=). They cannot be used for range queries, sorting, or pattern matching.",
                difficulty: "medium"
            },
            {
                question: "What is the main advantage of a partial index like this?<br><div class='code-block'>CREATE INDEX idx_active_customers ON customer (last_name)<br>WHERE active = 1;</div>",
                options: [
                    "It speeds up all queries on the customer table",
                    "It takes up less storage space and only indexes relevant rows",
                    "It automatically updates when customers become inactive",
                    "It prevents inactive customers from being queried"
                ],
                correctAnswer: 1,
                hint: "Consider what 'partial' means and how it affects storage and performance.",
                explanation: "Partial indexes are smaller because they only index rows meeting the WHERE condition, saving storage space and making index maintenance faster for the relevant subset of data.",
                difficulty: "medium"
            },
            {
                question: "Why would you create this functional index?<div class='code-block'>CREATE INDEX idx_customer_lower_name ON customer (LOWER(last_name));</div>",
                options: [
                    "To make the last_name column case-sensitive",
                    "To enable case-insensitive searches on last_name",
                    "To automatically convert all last_name values to lowercase",
                    "To prevent uppercase letters from being stored"
                ],
                correctAnswer: 1,
                hint: "Think about what queries this index would help optimize.",
                explanation: "This functional index enables efficient case-insensitive searches using queries like WHERE LOWER(last_name) = 'smith', without requiring a full table scan.",
                difficulty: "hard"
            },
            {
                question: "What is the benefit of using INCLUDE in this index?<div class='code-block'>CREATE INDEX idx_film_rating ON film (rating)<br>INCLUDE (title, rental_rate);</div>",
                options: [
                    "It makes the index smaller by excluding unnecessary columns",
                    "It allows the query to be satisfied entirely from the index without accessing the table",
                    "It creates separate indexes on the included columns automatically",
                    "It ensures the included columns are always sorted"
                ],
                correctAnswer: 1,
                hint: "Think about what happens when all needed data is available in the index itself.",
                explanation: "The INCLUDE clause creates a covering index that stores additional column values, allowing queries that need rating, title, and rental_rate to be satisfied entirely from the index without accessing the table data.",
                difficulty: "hard"
            },
            {
                question: "The pg_stat_user_indexes view shows how many times each index has been used by queries.",
                options: ["True", "False"],
                correctAnswer: 0,
                hint: "Think about PostgreSQL's built-in statistics collection for performance monitoring.",
                explanation: "True. The pg_stat_user_indexes view provides statistics including idx_scan (number of index scans), idx_tup_read, and idx_tup_fetch, helping identify unused or heavily used indexes.",
                difficulty: "medium"
            },
            {
                question: "What is the recommended way to create indexes on large production tables?",
                options: [
                    "CREATE INDEX (standard method)",
                    "CREATE INDEX CONCURRENTLY",
                    "CREATE INDEX WITH LOCK",
                    "CREATE INDEX IMMEDIATELY"
                ],
                correctAnswer: 1,
                hint: "Consider what happens to table availability during index creation on large tables.",
                explanation: "CREATE INDEX CONCURRENTLY allows index creation without locking the table for writes, making it safe for production environments where table availability is critical.",
                difficulty: "medium"
            },
            {
                question: "Foreign key columns should almost always have indexes for optimal join performance.",
                options: ["True", "False"],
                correctAnswer: 0,
                hint: "Think about what happens during JOIN operations and referential integrity checks.",
                explanation: "True. Indexing foreign key columns dramatically improves JOIN performance and speeds up referential integrity checks when parent records are updated or deleted.",
                difficulty: "easy"
            },
            {
                question: "Which column would be the WORST candidate for indexing?",
                options: [
                    "customer_id (unique identifier)",
                    "email (mostly unique values)",
                    "gender (only 'M' and 'F' values)",
                    "order_date (many different dates)"
                ],
                correctAnswer: 2,
                hint: "Consider how many different values exist and how much an index would narrow down the search.",
                explanation: "Gender with only 'M' and 'F' values has very low selectivity. An index wouldn't significantly narrow down searches since it would still return roughly half the table.",
                difficulty: "medium"
            },
            {
                question: "GIN (Generalized Inverted Index) indexes are primarily designed for:",
                options: [
                    "Speeding up mathematical calculations",
                    "Indexing arrays, JSONB, and full-text search data",
                    "Improving performance of simple equality comparisons",
                    "Reducing storage space requirements"
                ],
                correctAnswer: 1,
                hint: "Think about what types of data structures need special indexing strategies.",
                explanation: "GIN indexes are specialized for complex data types like arrays, JSONB documents, and full-text search where you need to find rows containing specific elements or terms.",
                difficulty: "hard"
            },
            {
                question: "The EXPLAIN command shows whether PostgreSQL is using an index for a specific query.",
                options: ["True", "False"],
                correctAnswer: 0,
                hint: "Consider what information EXPLAIN provides about query execution plans.",
                explanation: "True. EXPLAIN shows the query execution plan, including whether indexes are being used (Index Scan, Index Only Scan) or if a Sequential Scan (full table scan) is being performed.",
                difficulty: "medium"
            },
            {
                question: "What is the purpose of the REINDEX command?",
                options: [
                    "To create a new index on an existing table",
                    "To rebuild an existing index to optimize its structure and reclaim space",
                    "To delete unused indexes automatically",
                    "To copy an index from one table to another"
                ],
                correctAnswer: 1,
                hint: "Think about what happens to indexes over time with many data modifications.",
                explanation: "REINDEX rebuilds an existing index, removing bloat and optimizing its structure. This can improve performance and reclaim disk space after many INSERT, UPDATE, DELETE operations.",
                difficulty: "hard"
            },
            {
                question: "If you have an index on (customer_id, rental_date), do you also need a separate index on just (customer_id)?",
                options: [
                    "Yes, always create both for maximum performance",
                    "No, the composite index can handle queries filtering by customer_id alone",
                    "Yes, but only if customer_id queries are more frequent",
                    "No, composite indexes cannot be used for single-column queries"
                ],
                correctAnswer: 1,
                hint: "Think about how PostgreSQL can use the leftmost columns of a composite index.",
                explanation: "No separate index is needed. PostgreSQL can use the leftmost portion of a composite index (customer_id, rental_date) to efficiently handle queries that filter by customer_id alone.",
                difficulty: "hard"
            },
            {
                question: "Indexes consume additional disk storage space beyond the original table data.",
                options: ["True", "False"],
                correctAnswer: 0,
                hint: "Think about whether indexes are stored separately from table data.",
                explanation: "True. Indexes are separate data structures that require their own storage space. Large tables with many indexes can use significant additional disk space.",
                difficulty: "easy"
            },
            {
                question: "In which scenario would adding an index likely NOT improve performance?",
                options: [
                    "A large table with frequent SELECT queries filtering by a specific column",
                    "A table with heavy INSERT, UPDATE, DELETE operations and rare SELECT queries",
                    "A foreign key column used in frequent JOIN operations",
                    "A column used in WHERE clauses of slow queries"
                ],
                correctAnswer: 1,
                hint: "Consider the trade-off between read and write performance.",
                explanation: "When a table has heavy write operations (INSERT, UPDATE, DELETE) but rare SELECT queries, indexes would slow down the frequent writes without providing much benefit for the rare reads.",
                difficulty: "medium"
            }
        ];

        let currentQuestion = 0;
        let score = 0;
        let selectedAnswer = null;
        let quizCompleted = false;

        function shuffleArray(array) {
            const shuffled = [...array];
            for (let i = shuffled.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [shuffled[i], shuffled[j]] = [shuffled[j], shuffled[i]];
            }
            return shuffled;
        }

        function loadQuestion() {
            if (currentQuestion >= quizData.length) {
                showResults();
                return;
            }

            const question = quizData[currentQuestion];
            const questionCounter = document.getElementById('question-counter');
            const scoreDisplay = document.getElementById('score-display');
            const progressFill = document.getElementById('progress-fill');
            const questionText = document.getElementById('question-text');
            const optionsContainer = document.getElementById('options-container');
            const hintContainer = document.getElementById('hint-container');
            const explanation = document.getElementById('explanation');
            const nextBtn = document.getElementById('next-btn');
            const hintBtn = document.getElementById('hint-btn');

            // Update progress
            questionCounter.textContent = `Question ${currentQuestion + 1} of ${quizData.length}`;
            scoreDisplay.textContent = `Score: ${score}/${quizData.length}`;
            progressFill.style.width = `${((currentQuestion + 1) / quizData.length) * 100}%`;

            // Load question
            const difficultyClass = `difficulty-${question.difficulty}`;
            const difficultyBadge = `<span class="difficulty-badge ${difficultyClass}">${question.difficulty.toUpperCase()}</span>`;
            questionText.innerHTML = question.question + difficultyBadge;

            // Load options
            optionsContainer.innerHTML = '';
            question.options.forEach((option, index) => {
                const button = document.createElement('button');
                button.className = 'option-button';
                button.innerHTML = `<span class="option-letter">${String.fromCharCode(65 + index)}.</span>${option}`;
                button.onclick = () => selectAnswer(index);
                optionsContainer.appendChild(button);
            });

            // Reset controls
            selectedAnswer = null;
            hintContainer.classList.remove('show');
            explanation.classList.remove('show');
            nextBtn.disabled = true;
            hintBtn.style.display = 'block';

            if (currentQuestion === quizData.length - 1) {
                nextBtn.textContent = 'Show Results';
            }
        }

        function selectAnswer(answerIndex) {
            if (selectedAnswer !== null) return;

            selectedAnswer = answerIndex;
            const question = quizData[currentQuestion];
            const options = document.querySelectorAll('.option-button');
            const explanation = document.getElementById('explanation');
            const nextBtn = document.getElementById('next-btn');
            const hintBtn = document.getElementById('hint-btn');

            // Disable all options
            options.forEach(option => option.classList.add('disabled'));

            // Show correct/incorrect styling
            options[question.correctAnswer].classList.add('correct');
            if (answerIndex !== question.correctAnswer) {
                options[answerIndex].classList.add('incorrect');
            } else {
                score++;
                document.getElementById('score-display').textContent = `Score: ${score}/${quizData.length}`;
            }

            // Show explanation
            explanation.innerHTML = `
                <h4>⚡ Explanation</h4>
                <p><strong>Correct Answer:</strong> ${question.explanation}</p>
            `;
            explanation.classList.add('show');

            // Enable next button and hide hint button
            nextBtn.disabled = false;
            hintBtn.style.display = 'none';
        }

        function showHint() {
            const question = quizData[currentQuestion];
            const hintContainer = document.getElementById('hint-container');
            hintContainer.innerHTML = `<strong>💡 Hint:</strong> ${question.hint}`;
            hintContainer.classList.add('show');
        }

        function nextQuestion() {
            currentQuestion++;
            loadQuestion();
        }

        function showResults() {
            const quizContent = document.getElementById('quiz-content');
            const resultsContainer = document.getElementById('results-container');
            const finalScore = document.getElementById('final-score');
            const resultsMessage = document.getElementById('results-message');
            const correctCount = document.getElementById('correct-count');
            const incorrectCount = document.getElementById('incorrect-count');
            const accuracyPercent = document.getElementById('accuracy-percent');

            quizContent.style.display = 'none';
            resultsContainer.classList.add('show');

            const accuracy = Math.round((score / quizData.length) * 100);
            
            finalScore.textContent = `${score}/${quizData.length}`;
            correctCount.textContent = score;
            incorrectCount.textContent = quizData.length - score;
            accuracyPercent.textContent = `${accuracy}%`;

            let message = '';
            if (accuracy >= 90) {
                message = '🚀 Outstanding! You have excellent knowledge of PostgreSQL indexes!';
            } else if (accuracy >= 80) {
                message = '⚡ Great job! You understand database indexing strategies well.';
            } else if (accuracy >= 70) {
                message = '📈 Good work! You grasp the basics with room for improvement.';
            } else if (accuracy >= 60) {
                message = '📚 You\'re on the right track! Review indexing concepts and try again.';
            } else {
                message = '🎯 Keep studying! Indexes are crucial for database performance.';
            }

            resultsMessage.textContent = message;
        }

        function restartQuiz() {
            currentQuestion = 0;
            score = 0;
            selectedAnswer = null;
            quizCompleted = false;

            const quizContent = document.getElementById('quiz-content');
            const resultsContainer = document.getElementById('results-container');

            resultsContainer.classList.remove('show');
            quizContent.style.display = 'block';

            loadQuestion();
        }

        // Initialize quiz
        document.addEventListener('DOMContentLoaded', function() {
            loadQuestion();
        });
    </script>
</body>
</html>
