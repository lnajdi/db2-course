<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PostgreSQL Monitoring - Interactive Tutorial</title>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Inter', sans-serif; }
        #root { width: 100vw; min-height: 100vh; }
        .back-btn { position: fixed; top: 20px; left: 20px; z-index: 1000; padding: 10px 20px; background: rgba(0,0,0,0.7); color: white; border: none; border-radius: 20px; cursor: pointer; font-size: 14px; text-decoration: none; }
        .back-btn:hover { background: rgba(0,0,0,0.9); }
    </style>
</head>
<body>
    <a href="index.html" class="back-btn">← Back to Menu</a>
    <div id="root"></div>
    
    <script type="text/babel">
        const { useState, useEffect } = React;

        const slides = [
            { type: 'title', title: 'PostgreSQL Monitoring', subtitle: 'Keep your database healthy', icon: '📊' },
            { type: 'intro', title: 'Why Monitor?', items: ['Detect problems before they become critical', 'Optimize performance', 'Plan capacity', 'Ensure availability'] },
            { type: 'category', title: 'Key Metrics', subtitle: 'What to watch', items: [
                { icon: '🔌', name: 'Connections', desc: 'Active, idle, waiting' },
                { icon: '💾', name: 'Disk Usage', desc: 'Table & index sizes' },
                { icon: '🧠', name: 'Memory', desc: 'Cache hit ratio' },
                { icon: '🔒', name: 'Locks', desc: 'Blocking queries' },
                { icon: '📈', name: 'Transactions', desc: 'Commits, rollbacks' },
                { icon: '🐌', name: 'Slow Queries', desc: 'Long running statements' }
            ]},
            { type: 'sql', title: 'Connection Stats', query: `SELECT state, count(*) 
FROM pg_stat_activity 
GROUP BY state;`, desc: 'Monitor connection states' },
            { type: 'sql', title: 'Database Size', query: `SELECT pg_database.datname,
  pg_size_pretty(pg_database_size(datname)) 
FROM pg_database 
ORDER BY pg_database_size(datname) DESC;`, desc: 'Check database sizes' },
            { type: 'sql', title: 'Table Sizes', query: `SELECT relname, 
  pg_size_pretty(pg_total_relation_size(relid)) 
FROM pg_catalog.pg_statio_user_tables 
ORDER BY pg_total_relation_size(relid) DESC 
LIMIT 10;`, desc: 'Find largest tables' },
            { type: 'sql', title: 'Cache Hit Ratio', query: `SELECT 
  round(100 * sum(blks_hit) / 
  nullif(sum(blks_hit) + sum(blks_read), 0), 2) 
  AS cache_hit_ratio 
FROM pg_stat_database;`, desc: 'Should be > 99%' },
            { type: 'sql', title: 'Active Queries', query: `SELECT pid, now() - query_start AS duration, 
  query, state 
FROM pg_stat_activity 
WHERE state != 'idle' 
ORDER BY duration DESC;`, desc: 'Find long-running queries' },
            { type: 'sql', title: 'Blocking Locks', query: `SELECT blocked.pid AS blocked_pid,
  blocking.pid AS blocking_pid,
  blocked.query AS blocked_query
FROM pg_stat_activity blocked
JOIN pg_stat_activity blocking 
  ON blocking.pid = ANY(pg_blocking_pids(blocked.pid));`, desc: 'Identify lock contention' },
            { type: 'sql', title: 'Index Usage', query: `SELECT relname, 
  idx_scan, seq_scan,
  idx_scan::float / (idx_scan + seq_scan) AS ratio
FROM pg_stat_user_tables 
WHERE seq_scan + idx_scan > 0
ORDER BY seq_scan DESC LIMIT 10;`, desc: 'Tables needing indexes' },
            { type: 'sql', title: 'Dead Tuples', query: `SELECT relname, 
  n_dead_tup, n_live_tup,
  round(n_dead_tup::numeric / 
    nullif(n_live_tup,0) * 100, 2) AS dead_ratio
FROM pg_stat_user_tables 
ORDER BY n_dead_tup DESC LIMIT 10;`, desc: 'Tables needing VACUUM' },
            { type: 'views', title: 'Key System Views', items: [
                { view: 'pg_stat_activity', desc: 'Current connections' },
                { view: 'pg_stat_database', desc: 'Database-level stats' },
                { view: 'pg_stat_user_tables', desc: 'Table statistics' },
                { view: 'pg_stat_user_indexes', desc: 'Index usage' },
                { view: 'pg_locks', desc: 'Lock information' },
                { view: 'pg_stat_replication', desc: 'Replication status' }
            ]},
            { type: 'config', title: 'Enable Stats', items: [
                { param: 'track_activities', value: 'on' },
                { param: 'track_counts', value: 'on' },
                { param: 'track_io_timing', value: 'on' },
                { param: 'log_min_duration_statement', value: '1000' }
            ]},
            { type: 'tools', title: 'Monitoring Tools', items: [
                { name: 'pg_stat_statements', desc: 'Query statistics extension' },
                { name: 'pgBadger', desc: 'Log analyzer' },
                { name: 'Prometheus + Grafana', desc: 'Metrics & dashboards' },
                { name: 'pgAdmin', desc: 'Built-in monitoring' }
            ]},
            { type: 'summary', title: 'Summary', items: ['Monitor connections, disk, memory, locks', 'Use pg_stat_* views', 'Track cache hit ratio (>99%)', 'Watch for slow queries', 'Check dead tuples regularly'] }
        ];

        function Slide({ slide }) {
            if (slide.type === 'title') {
                return (
                    <div style={{ textAlign: 'center', padding: '60px' }}>
                        <div style={{ fontSize: '4rem', marginBottom: '20px' }}>{slide.icon}</div>
                        <h1 style={{ fontSize: '3rem', fontWeight: 800, color: '#1a1a2e', marginBottom: '16px' }}>{slide.title}</h1>
                        <p style={{ fontSize: '1.3rem', color: '#6b7280' }}>{slide.subtitle}</p>
                    </div>
                );
            }
            if (slide.type === 'intro') {
                return (
                    <div style={{ padding: '50px', maxWidth: '600px', margin: '0 auto' }}>
                        <h2 style={{ fontSize: '2rem', color: '#1a1a2e', marginBottom: '30px', textAlign: 'center' }}>{slide.title}</h2>
                        {slide.items.map((item, i) => (
                            <div key={i} style={{ padding: '16px 20px', background: '#f0fdf4', borderRadius: '10px', marginBottom: '12px', color: '#166534', fontSize: '1.1rem' }}>✓ {item}</div>
                        ))}
                    </div>
                );
            }
            if (slide.type === 'category') {
                return (
                    <div style={{ padding: '40px' }}>
                        <h2 style={{ fontSize: '2rem', color: '#1a1a2e', marginBottom: '8px', textAlign: 'center' }}>{slide.title}</h2>
                        <p style={{ color: '#6b7280', marginBottom: '30px', textAlign: 'center' }}>{slide.subtitle}</p>
                        <div style={{ display: 'grid', gridTemplateColumns: 'repeat(3, 1fr)', gap: '16px', maxWidth: '700px', margin: '0 auto' }}>
                            {slide.items.map((item, i) => (
                                <div key={i} style={{ padding: '20px', background: '#f9fafb', borderRadius: '12px', textAlign: 'center' }}>
                                    <div style={{ fontSize: '2rem', marginBottom: '8px' }}>{item.icon}</div>
                                    <div style={{ fontWeight: 600, color: '#1a1a2e', marginBottom: '4px' }}>{item.name}</div>
                                    <div style={{ fontSize: '0.85rem', color: '#6b7280' }}>{item.desc}</div>
                                </div>
                            ))}
                        </div>
                    </div>
                );
            }
            if (slide.type === 'sql') {
                return (
                    <div style={{ padding: '40px', maxWidth: '700px', margin: '0 auto' }}>
                        <h2 style={{ fontSize: '1.8rem', color: '#1a1a2e', marginBottom: '8px', textAlign: 'center' }}>{slide.title}</h2>
                        <p style={{ color: '#6b7280', marginBottom: '24px', textAlign: 'center' }}>{slide.desc}</p>
                        <pre style={{ padding: '24px', background: '#1a1a2e', borderRadius: '12px', overflow: 'auto', fontFamily: 'monospace', fontSize: '0.9rem' }}>
                            <code style={{ color: '#22c55e' }}>{slide.query}</code>
                        </pre>
                    </div>
                );
            }
            if (slide.type === 'views') {
                return (
                    <div style={{ padding: '40px', maxWidth: '600px', margin: '0 auto' }}>
                        <h2 style={{ fontSize: '2rem', color: '#1a1a2e', marginBottom: '30px', textAlign: 'center' }}>{slide.title}</h2>
                        {slide.items.map((item, i) => (
                            <div key={i} style={{ display: 'flex', gap: '16px', padding: '14px 18px', background: '#f9fafb', borderRadius: '10px', marginBottom: '10px', alignItems: 'center' }}>
                                <code style={{ padding: '6px 12px', background: '#1a1a2e', color: '#22c55e', borderRadius: '6px', fontSize: '0.85rem' }}>{item.view}</code>
                                <span style={{ color: '#374151' }}>{item.desc}</span>
                            </div>
                        ))}
                    </div>
                );
            }
            if (slide.type === 'config') {
                return (
                    <div style={{ padding: '40px', maxWidth: '550px', margin: '0 auto' }}>
                        <h2 style={{ fontSize: '2rem', color: '#1a1a2e', marginBottom: '30px', textAlign: 'center' }}>{slide.title}</h2>
                        <div style={{ background: '#f9fafb', borderRadius: '12px', overflow: 'hidden' }}>
                            <div style={{ padding: '12px 16px', background: '#e5e7eb', fontWeight: 600, color: '#374151' }}>postgresql.conf</div>
                            {slide.items.map((item, i) => (
                                <div key={i} style={{ padding: '12px 16px', borderBottom: '1px solid #e5e7eb', fontFamily: 'monospace', fontSize: '0.9rem' }}>
                                    <span style={{ color: '#3b82f6' }}>{item.param}</span> = <span style={{ color: '#22c55e' }}>{item.value}</span>
                                </div>
                            ))}
                        </div>
                    </div>
                );
            }
            if (slide.type === 'tools') {
                return (
                    <div style={{ padding: '40px', maxWidth: '600px', margin: '0 auto' }}>
                        <h2 style={{ fontSize: '2rem', color: '#1a1a2e', marginBottom: '30px', textAlign: 'center' }}>{slide.title}</h2>
                        <div style={{ display: 'grid', gridTemplateColumns: '1fr 1fr', gap: '16px' }}>
                            {slide.items.map((item, i) => (
                                <div key={i} style={{ padding: '20px', background: '#eff6ff', borderRadius: '12px' }}>
                                    <div style={{ fontWeight: 700, color: '#1e40af', marginBottom: '6px' }}>{item.name}</div>
                                    <div style={{ fontSize: '0.9rem', color: '#3b82f6' }}>{item.desc}</div>
                                </div>
                            ))}
                        </div>
                    </div>
                );
            }
            if (slide.type === 'summary') {
                return (
                    <div style={{ padding: '50px', maxWidth: '550px', margin: '0 auto' }}>
                        <h2 style={{ fontSize: '2rem', color: '#1a1a2e', marginBottom: '30px', textAlign: 'center' }}>{slide.title}</h2>
                        {slide.items.map((item, i) => (
                            <div key={i} style={{ display: 'flex', alignItems: 'center', gap: '16px', padding: '16px 20px', background: 'linear-gradient(135deg, #eff6ff, #faf5ff)', borderRadius: '10px', marginBottom: '12px' }}>
                                <span style={{ width: '32px', height: '32px', borderRadius: '50%', background: '#3b82f6', color: '#fff', display: 'flex', alignItems: 'center', justifyContent: 'center', fontWeight: 700, fontSize: '0.9rem' }}>{i+1}</span>
                                <span style={{ color: '#1e3a5f', fontWeight: 500 }}>{item}</span>
                            </div>
                        ))}
                    </div>
                );
            }
            return null;
        }

        function MonitoringSlideshow() {
            const [current, setCurrent] = useState(0);
            const next = () => setCurrent(c => Math.min(c + 1, slides.length - 1));
            const prev = () => setCurrent(c => Math.max(c - 1, 0));
            useEffect(() => { const h = (e) => { if (e.key === 'ArrowRight' || e.key === ' ') next(); if (e.key === 'ArrowLeft') prev(); }; window.addEventListener('keydown', h); return () => window.removeEventListener('keydown', h); }, []);
            return (
                <div style={{ minHeight: '100vh', background: '#fff', display: 'flex', flexDirection: 'column' }}>
                    <div style={{ flex: 1, display: 'flex', alignItems: 'center', justifyContent: 'center' }}>
                        <div style={{ width: '100%', maxWidth: '900px' }}><Slide slide={slides[current]} /></div>
                    </div>
                    <div style={{ padding: '20px 40px', borderTop: '1px solid #e5e7eb', display: 'flex', alignItems: 'center', justifyContent: 'space-between', background: '#fafafa' }}>
                        <button onClick={prev} disabled={current === 0} style={{ padding: '12px 24px', background: current === 0 ? '#e5e7eb' : '#1a1a2e', color: current === 0 ? '#9ca3af' : '#fff', border: 'none', borderRadius: '8px', fontWeight: 600, cursor: current === 0 ? 'default' : 'pointer' }}>← Previous</button>
                        <div style={{ display: 'flex', gap: '6px' }}>
                            {slides.map((_, i) => (<button key={i} onClick={() => setCurrent(i)} style={{ width: i === current ? '20px' : '8px', height: '8px', borderRadius: '4px', background: i === current ? '#3b82f6' : '#d1d5db', border: 'none', cursor: 'pointer' }} />))}
                        </div>
                        <button onClick={next} disabled={current === slides.length - 1} style={{ padding: '12px 24px', background: current === slides.length - 1 ? '#e5e7eb' : '#3b82f6', color: current === slides.length - 1 ? '#9ca3af' : '#fff', border: 'none', borderRadius: '8px', fontWeight: 600, cursor: current === slides.length - 1 ? 'default' : 'pointer' }}>Next →</button>
                    </div>
                    <div style={{ position: 'fixed', bottom: '80px', right: '40px', padding: '8px 16px', background: '#1a1a2e', color: '#fff', borderRadius: '20px', fontSize: '0.85rem' }}>{current + 1} / {slides.length}</div>
                </div>
            );
        }

        ReactDOM.createRoot(document.getElementById('root')).render(<MonitoringSlideshow />);
    </script>
</body>
</html>
