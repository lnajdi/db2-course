<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Backup Flow Diagram - PostgreSQL DBA</title>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://unpkg.com/reactflow@11/dist/umd/index.js"></script>
    <link href="https://unpkg.com/reactflow@11/dist/style.css" rel="stylesheet" />
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        #root { width: 100vw; height: 100vh; }
        .back-btn {
            position: fixed;
            top: 20px;
            right: 20px;
            z-index: 1000;
            padding: 10px 20px;
            background: rgba(0, 0, 0, 0.7);
            color: white;
            border: none;
            border-radius: 20px;
            cursor: pointer;
            font-size: 14px;
            text-decoration: none;
            transition: all 0.3s ease;
        }
        .back-btn:hover {
            background: rgba(0, 0, 0, 0.9);
            transform: scale(1.05);
        }
    </style>
</head>
<body>
    <a href="index.html" class="back-btn">← Back to Menu</a>
    <div id="root"></div>
    
    <script type="text/babel">
        const { useCallback } = React;
        const { 
            ReactFlow, 
            MiniMap, 
            Controls, 
            Background, 
            useNodesState, 
            useEdgesState,
            Handle,
            Position 
        } = window.ReactFlow;

        // Custom Node Component
        const CustomNode = ({ data }) => {
            return (
                <div style={{
                    padding: '20px',
                    borderRadius: '12px',
                    background: data.gradient || 'linear-gradient(135deg, #667eea 0%, #764ba2 100%)',
                    border: data.borderColor ? `3px solid ${data.borderColor}` : 'none',
                    color: 'white',
                    minWidth: data.width || '200px',
                    boxShadow: '0 10px 30px rgba(0,0,0,0.3)',
                    fontFamily: '"Segoe UI", sans-serif',
                    position: 'relative',
                }}>
                    <Handle
                        type="target"
                        position={Position.Top}
                        style={{ background: '#fff', width: '12px', height: '12px' }}
                    />
                    <div style={{ fontSize: '14px', fontWeight: 'bold', marginBottom: '8px', letterSpacing: '1px' }}>
                        {data.label}
                    </div>
                    {data.description && (
                        <div style={{ fontSize: '11px', opacity: 0.9, lineHeight: '1.5' }}>
                            {data.description}
                        </div>
                    )}
                    {data.features && (
                        <div style={{ marginTop: '12px', fontSize: '10px' }}>
                            {data.features.map((feature, idx) => (
                                <div key={idx} style={{ marginTop: '6px', opacity: 0.85 }}>
                                    • {feature}
                                </div>
                            ))}
                        </div>
                    )}
                    <Handle
                        type="source"
                        position={Position.Bottom}
                        style={{ background: '#fff', width: '12px', height: '12px' }}
                    />
                </div>
            );
        };

        const nodeTypes = { custom: CustomNode };

        function BackupFlowDiagram() {
            const initialNodes = [
                {
                    id: '1',
                    type: 'custom',
                    position: { x: 400, y: 50 },
                    data: {
                        label: 'BACKUP STRATEGIES',
                        description: 'Data protection and recovery methods',
                        gradient: 'linear-gradient(135deg, #f093fb 0%, #f5576c 100%)',
                        width: '280px',
                    },
                },
                {
                    id: '2',
                    type: 'custom',
                    position: { x: 150, y: 220 },
                    data: {
                        label: 'OFFLINE BACKUP',
                        description: 'Database shutdown required',
                        gradient: 'linear-gradient(135deg, #4facfe 0%, #00f2fe 100%)',
                        features: ['Consistent snapshot', 'No transactions during backup', 'Clean shutdown state', 'Longer downtime'],
                    },
                },
                {
                    id: '3',
                    type: 'custom',
                    position: { x: 600, y: 220 },
                    data: {
                        label: 'ONLINE BACKUP',
                        description: 'Database remains operational',
                        gradient: 'linear-gradient(135deg, #fa709a 0%, #fee140 100%)',
                        features: ['Zero downtime', 'Continuous operations', 'Archive log mode', 'Point-in-time recovery'],
                    },
                },
                {
                    id: '4',
                    type: 'custom',
                    position: { x: 50, y: 480 },
                    data: {
                        label: 'LOGICAL BACKUP',
                        description: 'Export data structures & content',
                        gradient: 'linear-gradient(135deg, #a8edea 0%, #fed6e3 100%)',
                        features: ['SQL dumps', 'Table-level exports', 'Cross-platform', 'Slower restore'],
                    },
                },
                {
                    id: '5',
                    type: 'custom',
                    position: { x: 280, y: 480 },
                    data: {
                        label: 'PHYSICAL BACKUP',
                        description: 'Copy actual data files',
                        gradient: 'linear-gradient(135deg, #ffecd2 0%, #fcb69f 100%)',
                        features: ['Binary file copy', 'Faster backup/restore', 'Platform-specific', 'Complete database image'],
                    },
                },
                {
                    id: '6',
                    type: 'custom',
                    position: { x: 520, y: 480 },
                    data: {
                        label: 'LOGICAL BACKUP',
                        description: 'Selective data export',
                        gradient: 'linear-gradient(135deg, #ff9a9e 0%, #fecfef 100%)',
                        features: ['Database running', 'Selective tables', 'Flexible recovery', 'Application consistent'],
                    },
                },
                {
                    id: '7',
                    type: 'custom',
                    position: { x: 750, y: 480 },
                    data: {
                        label: 'PHYSICAL BACKUP',
                        description: 'Hot backup mode',
                        gradient: 'linear-gradient(135deg, #fbc2eb 0%, #a6c1ee 100%)',
                        features: ['RMAN/OS utilities', 'Block-level copy', 'Incremental backups', 'Fast recovery'],
                    },
                },
                {
                    id: '8',
                    type: 'custom',
                    position: { x: 50, y: 720 },
                    data: {
                        label: 'USE CASE',
                        description: 'Development, testing, migrations',
                        gradient: 'linear-gradient(135deg, #d299c2 0%, #fef9d7 100%)',
                        width: '180px',
                    },
                },
                {
                    id: '9',
                    type: 'custom',
                    position: { x: 280, y: 720 },
                    data: {
                        label: 'USE CASE',
                        description: 'Cold storage, archival, DR',
                        gradient: 'linear-gradient(135deg, #89f7fe 0%, #66a6ff 100%)',
                        width: '180px',
                    },
                },
                {
                    id: '10',
                    type: 'custom',
                    position: { x: 520, y: 720 },
                    data: {
                        label: 'USE CASE',
                        description: '24/7 systems, partial recovery',
                        gradient: 'linear-gradient(135deg, #fddb92 0%, #d1fdff 100%)',
                        width: '180px',
                    },
                },
                {
                    id: '11',
                    type: 'custom',
                    position: { x: 750, y: 720 },
                    data: {
                        label: 'USE CASE',
                        description: 'Enterprise, critical systems',
                        gradient: 'linear-gradient(135deg, #feada6 0%, #f5efef 100%)',
                        width: '180px',
                    },
                },
            ];

            const initialEdges = [
                { id: 'e1-2', source: '1', target: '2', animated: true, style: { stroke: '#4facfe', strokeWidth: 3 } },
                { id: 'e1-3', source: '1', target: '3', animated: true, style: { stroke: '#fa709a', strokeWidth: 3 } },
                { id: 'e2-4', source: '2', target: '4', animated: true, style: { stroke: '#a8edea', strokeWidth: 2 } },
                { id: 'e2-5', source: '2', target: '5', animated: true, style: { stroke: '#ffecd2', strokeWidth: 2 } },
                { id: 'e3-6', source: '3', target: '6', animated: true, style: { stroke: '#ff9a9e', strokeWidth: 2 } },
                { id: 'e3-7', source: '3', target: '7', animated: true, style: { stroke: '#fbc2eb', strokeWidth: 2 } },
                { id: 'e4-8', source: '4', target: '8', style: { stroke: '#d299c2', strokeWidth: 2, strokeDasharray: '5,5' } },
                { id: 'e5-9', source: '5', target: '9', style: { stroke: '#89f7fe', strokeWidth: 2, strokeDasharray: '5,5' } },
                { id: 'e6-10', source: '6', target: '10', style: { stroke: '#fddb92', strokeWidth: 2, strokeDasharray: '5,5' } },
                { id: 'e7-11', source: '7', target: '11', style: { stroke: '#feada6', strokeWidth: 2, strokeDasharray: '5,5' } },
            ];

            const [nodes, setNodes, onNodesChange] = useNodesState(initialNodes);
            const [edges, setEdges, onEdgesChange] = useEdgesState(initialEdges);

            return (
                <div style={{ width: '100vw', height: '100vh', background: 'linear-gradient(135deg, #0f0c29, #302b63, #24243e)' }}>
                    <div style={{
                        position: 'absolute',
                        top: '20px',
                        left: '20px',
                        zIndex: 10,
                        background: 'rgba(0,0,0,0.7)',
                        padding: '20px',
                        borderRadius: '12px',
                        color: 'white',
                        fontFamily: '"Segoe UI", sans-serif',
                        maxWidth: '300px',
                        backdropFilter: 'blur(10px)',
                    }}>
                        <h2 style={{ margin: '0 0 12px 0', fontSize: '18px', letterSpacing: '2px' }}>
                            BACKUP ARCHITECTURE
                        </h2>
                        <p style={{ margin: '0', fontSize: '12px', lineHeight: '1.6', opacity: 0.9 }}>
                            Comprehensive visualization of backup strategies comparing offline vs online operations and logical vs physical backup methods.
                        </p>
                    </div>

                    <ReactFlow
                        nodes={nodes}
                        edges={edges}
                        onNodesChange={onNodesChange}
                        onEdgesChange={onEdgesChange}
                        nodeTypes={nodeTypes}
                        fitView
                        attributionPosition="bottom-left"
                    >
                        <Controls style={{ background: 'rgba(0,0,0,0.7)', border: 'none' }} />
                        <MiniMap
                            style={{
                                background: 'rgba(0,0,0,0.7)',
                                border: '2px solid rgba(255,255,255,0.2)',
                            }}
                            nodeColor={() => '#667eea'}
                        />
                        <Background variant="dots" gap={20} size={1} color="rgba(255,255,255,0.1)" />
                    </ReactFlow>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<BackupFlowDiagram />);
    </script>
</body>
</html>
